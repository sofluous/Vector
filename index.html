<!doctype html>
<html lang="en" data-theme="steel-night" data-ds-theme-storage="vectors.theme" data-ds-theme-default="steel-night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vectors | Pattern Library</title>
  <link rel="stylesheet" href="./design-system/theme.css">
  <link rel="stylesheet" href="./css/workspace.css">
  <script src="./design-system/js/theme-registry.js" defer></script>
  <script src="./design-system/js/theme-selector.js" defer></script>
  <script src="./patterns/karakusa.js" defer></script>
  <script src="./patterns/catalog.js" defer></script>
  <script src="./patterns/library.js" defer></script>
  <script src="./patterns/validation.js" defer></script>
  <script src="./patterns/svg.js" defer></script>
  <script src="./patterns/capabilities.js" defer></script>
  <script src="./patterns/session.js" defer></script>
  <script src="./patterns/motifs.js" defer></script>
  <script src="./patterns/presentation.js" defer></script>
  <script src="./patterns/content.js" defer></script>
  <script src="./workspace.js" defer></script>
</head>
<body>
  <header class="workspace-head">
    <h1>Vectors</h1>
    <div class="theme-slot"><label class="sr-only" for="themeSelect">Theme</label><select id="themeSelect" data-ds-theme-select></select></div>
  </header>
  <main class="workspace">
    <details class="panel library" open>
      <summary>Library</summary>
      <div class="library-tools">
        <label class="sr-only" for="patternSearch">Search Japanese patterns</label>
        <input id="patternSearch" type="search" placeholder="Search patterns">
        <p id="libraryCount" class="hint" role="status" aria-live="polite"></p>
      </div>
      <div id="workspaceGallery" class="pattern-list" aria-label="Choose a pattern"></div>
    </details>
    <section class="panel canvas" aria-labelledby="selectedName">
      <div class="canvas-toolbar" aria-label="Preview controls">
      <h2 id="selectedName"></h2>
      <fieldset class="view-modes" id="previewModes">
        <legend class="sr-only">View and export</legend>
        <label><input type="radio" name="previewMode" value="motif"> Motif</label>
        <label><input type="radio" name="previewMode" value="tile"> Tile</label>
        <label><input type="radio" name="previewMode" value="field" checked> Pattern</label>
      </fieldset>
      <div class="export-actions" aria-label="Selected pattern export">
        <button id="copySelected" type="button">Copy</button>
        <button id="downloadSelected" class="primary" type="button">Export</button>
      </div>
      <details id="patternInfo" class="pattern-info">
        <summary>Info</summary>
        <div class="info-content">
          <p id="selectedDescription"></p>
          <p id="viewExplanation"></p>
          <p id="strokeLimit"></p>
          <p>Density affects Pattern view; shifts affect Tile and Pattern. Changes stay with each pattern until reload.</p>
        </div>
      </details>
      </div>
      <div class="inspection-bar">
        <div id="workspaceTabs" class="workspace-tabs" role="tablist" aria-label="Pattern inspection">
          <button id="tab-preview" type="button" role="tab" aria-selected="true" aria-controls="panel-preview" tabindex="0" data-tab="preview">Preview</button>
          <button id="tab-construction" type="button" role="tab" aria-selected="false" aria-controls="panel-construction" tabindex="-1" data-tab="construction">Construction</button>
          <button id="tab-context" type="button" role="tab" aria-selected="false" aria-controls="panel-context" tabindex="-1" data-tab="context">Context</button>
        </div>
        <div id="zoomControls" class="zoom-controls" aria-label="Preview zoom">
          <button id="zoomOut" type="button" aria-label="Zoom out">-</button>
          <button id="zoomFit" type="button" title="Fit artwork to preview">Fit</button>
          <output id="zoomValue" aria-label="Zoom relative to fit">100%</output>
          <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div id="panel-preview" class="preview-panel" role="tabpanel" aria-labelledby="tab-preview" tabindex="0">
      <div id="selectedPreview" class="selected-preview" role="img" aria-label="Selected pattern repeated field"></div>
      </div>
      <section id="panel-construction" class="inspection-content" role="tabpanel" aria-labelledby="tab-construction" tabindex="0" hidden>
        <h3 id="constructionTitle"></h3>
        <div id="constructionDiagram" class="construction-diagram" role="img"></div>
        <pre id="constructionNotes"></pre>
      </section>
      <section id="panel-context" class="inspection-content" role="tabpanel" aria-labelledby="tab-context" tabindex="0" hidden>
        <h3 id="contextTitle"></h3><p id="contextDescription"></p>
        <h4>Review</h4><p id="contextReview"></p>
        <h4>Reference</h4><p id="contextProvenance"></p>
        <a id="contextReference" target="_blank" rel="noopener">Open local reference image</a>
      </section>
      <div class="canvas-status"><p id="outputSummary"></p><p id="workspaceStatus" role="status" aria-live="polite"></p></div>
    </section>
    <details class="panel inspector" open>
      <summary>Properties</summary>
      <form id="workspaceForm" novalidate>
        <div id="workspaceFields" class="fields"></div>
        <button id="resetSelected" type="button" title="Restore this pattern's original settings">Reset pattern</button>
      </form>
    </details>
  </main>
</body>
</html>
